# 自动测试 + 打包 Windows / macOS / Linux 安装包。
# - 手动运行（Actions → Build installers → Run workflow）：安装包在本次运行的 Artifacts 里下载
# - 推送 v 开头的 tag（如 v1.0.1，需与 app_info.py 的 VERSION 一致）：自动创建 GitHub Release，
#   程序内“检查更新”读取的就是这里的最新 Release
name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python master测试.py

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-14          # Apple 芯片
          - os: macos-15-intel    # Intel Mac
          - os: ubuntu-22.04      # 较老的 glibc，兼容更多 Linux 发行版
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: pip install pyinstaller pyserial pillow certifi
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress
      - name: Install Tk (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk tk
      - name: Build
        run: python packaging/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: MeterSimulator-${{ matrix.os }}
          path: dist/*
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
